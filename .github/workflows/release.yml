name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.9.0). Must already exist as a git tag.'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrEmpty($tag)) { $tag = "${{ github.ref_name }}" }
          echo "TAG=$tag"          >> $env:GITHUB_OUTPUT
          echo "VERSION=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Restore + build
        run: |
          dotnet restore DeepPurge.sln
          dotnet build DeepPurge.sln -c Release --no-restore

      - name: Test
        if: matrix.rid == 'win-x64'
        run: dotnet test tests/DeepPurge.Tests/DeepPurge.Tests.csproj -c Release --no-build

      - name: Publish GUI
        run: >
          dotnet publish src/DeepPurge.App/DeepPurge.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -p:DebugSymbols=false
          --output build/${{ matrix.rid }} --nologo

      - name: Publish CLI
        run: >
          dotnet publish src/DeepPurge.Cli/DeepPurge.Cli.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -p:DebugSymbols=false
          --output build/${{ matrix.rid }} --nologo

      - name: Rename for platform
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $suffix = if ($rid -eq 'win-arm64') { '-arm64' } else { '' }
          Rename-Item "build/$rid/DeepPurge.exe" "DeepPurge$suffix.exe"
          Rename-Item "build/$rid/DeepPurgeCli.exe" "DeepPurgeCli$suffix.exe"
          Get-ChildItem "build/$rid" -Exclude "DeepPurge*$suffix.exe","DeepPurgeCli*$suffix.exe" |
            Remove-Item -Force -Recurse -ErrorAction SilentlyContinue

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepPurge-${{ matrix.rid }}
          path: build/${{ matrix.rid }}/*.exe

  release:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrEmpty($tag)) { $tag = "${{ github.ref_name }}" }
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Generate SHA256
        shell: pwsh
        run: |
          $exes = Get-ChildItem artifacts -Recurse -Filter '*.exe'
          $exes | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          } | Out-File artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = '${{ steps.tag.outputs.TAG }}'
          $exists = $true
          try { gh release view $tag 2>&1 | Out-Null } catch { $exists = $false }
          if (-not $exists) {
            gh release create $tag --title $tag --notes "Automated release of $tag. See CHANGELOG.md for details."
          }
          $exes = Get-ChildItem artifacts -Recurse -Filter '*.exe'
          $files = ($exes | ForEach-Object { $_.FullName }) + "artifacts/SHA256SUMS.txt"
          gh release upload $tag @files --clobber
